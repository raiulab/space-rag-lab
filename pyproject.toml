[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-rag-lab"
version = "0.1.1"
description = "A staged, Japanese-language RAG learning project using space technology reports"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["rag", "education", "retrieval", "streamlit", "japanese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
aws = ["boto3>=1.34"]
pdf = ["pypdf>=6.10,<7"]
ui = ["streamlit[pdf]>=1.65,<2"]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17"]
security = ["pip-audit==2.10.1"]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[project.urls]
Homepage = "https://github.com/raiulab/space-rag-lab"
Repository = "https://github.com/raiulab/space-rag-lab"
Issues = "https://github.com/raiulab/space-rag-lab/issues"
Changelog = "https://github.com/raiulab/space-rag-lab/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
