name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline evaluation
        run: rag-lab all

  optional-features:
    name: UI and PDF / Python 3.12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional features and development tools
        run: python -m pip install -e '.[ui,pdf,dev]'
      - name: Run lint
        run: ruff check .
      - name: Run full unit tests
        run: python -m unittest discover -s tests -v

  dependency-audit:
    name: Dependency audit / Python 3.12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install patched packaging tools
        run: python -m pip install --upgrade pip==26.2 setuptools==83.0.0 wheel==0.46.2
      - name: Install all optional features and audit tool
        run: python -m pip install -e '.[api,aws,pdf,ui,dev,security]'
      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable
