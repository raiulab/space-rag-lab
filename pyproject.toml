[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-rag-lab"
version = "0.1.0"
description = "A staged, Japanese-language RAG learning project using space technology reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
aws = ["boto3>=1.34"]
pdf = ["pypdf>=6.10,<7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rag-lab = "rag_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
